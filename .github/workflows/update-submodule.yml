name: Sync Content Submodules

on:
  schedule:
    # Daily 12:00 Beijing (04:00 UTC)
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Init and update content submodules
        id: changes
        run: |
          set -e
          bash scripts/update-content-submodules.sh board-docs ros2-course
          if git diff --quiet -- board-docs ros2-course; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Content submodules are up to date"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --submodule=short -- board-docs ros2-course
          fi

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.changed == 'true'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Verify build
        if: steps.changes.outputs.changed == 'true'
        run: |
          pnpm install --frozen-lockfile
          node --test scripts/*.test.mjs
          pnpm build

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add board-docs ros2-course
          if git diff --staged --quiet -- board-docs ros2-course; then
            echo "No staged submodule changes, skipping push"
            exit 0
          fi
          git commit -m "chore: bump content submodules"
          git push
